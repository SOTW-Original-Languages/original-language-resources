name: Validate SOTW canonical v1
on:
  push:
    paths:
      - 'schemas/sotw-canonical-v1.schema.json'
      - 'examples/sotw-canonical-v1.synthetic.json'
      - 'scripts/validate_canonical_v1.py'
      - '.github/workflows/validate-sotw-canonical-v1.yml'
  workflow_dispatch:
jobs:
  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - run: python scripts/validate_canonical_v1.py
